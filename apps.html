<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveShop - Apps</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      text-align: center;
    }
    header {
      background-color: #1f1f1f;
      padding: 20px;
      font-size: 1.5em;
      color: #00ff88;
      font-weight: bold;
    }
    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }
    .card {
      background-color: #1e1e1e;
      border: 2px solid #00ff88;
      border-radius: 10px;
      padding: 20px;
      text-align: left;
      transition: 0.3s;
    }
    .card:hover {
      background-color: #00ff88;
      color: #121212;
      transform: scale(1.03);
    }
    .card h3 {
      margin-top: 0;
    }
    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background-color: #00ff88;
      color: #121212;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: 0.3s;
    }
    .download-btn:hover {
      background-color: #00cc66;
    }
    footer {
      background-color: #1f1f1f;
      padding: 15px;
      font-size: 0.9em;
      color: #888;
      margin-top: 40px;
    }
    .back {
      display: inline-block;
      margin: 20px;
      padding: 10px 15px;
      background-color: #333;
      color: #e0e0e0;
      text-decoration: none;
      border-radius: 5px;
    }
    .back:hover {
      background-color: #00ff88;
      color: #121212;
    }
  </style>
</head>
<body>
  <header>
    📦 LiveShop – Apps
  </header>

  <a href="index.html" class="back">⬅ Ana Sayfa</a>

  <div class="apps">
    <div class="card">
      <footer>
    Powered by Verify Studios© 2025
  </footer>
</body>
</html>
