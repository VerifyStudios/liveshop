<!DOCTYPE html>
<html lang="tr">
<head>

      font-family: Arial, sans-serif;

    }
    header {
      background-color: #1f1f1f;
      padding: 20px;
      font-size: 1.5em;
      color: #00ff88;
      font-weight: bold;
    }
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 40px;
    }
    .category {
      background-color: #1e1e1e;
      border: 2px solid #00ff88;
      border-radius: 10px;
      padding: 30px;
      font-size: 1.2em;
      text-decoration: none;
      color: #e0e0e0;
      transition: 0.3s;
    }
    .category:hover {
      background-color: #00ff88;
      color: #121212;
      transform: scale(1.05);
    }
    footer {
      background-color: #1f1f1f;
      padding: 15px;
      font-size: 0.9em;
      color: #888;
      margin-top: 40px;
